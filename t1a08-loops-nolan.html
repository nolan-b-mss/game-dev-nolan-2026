<h4> Example working code</h4>

Max loops: <input id="myNum01" type=number value="4" ><br>
weird number: <input id="myWeird" type=number value="2" ><br>

<input type=button value="Basic For Loop with Decisions" onclick="{
  document.getElementById('myDiv01').innerHTML = ''
  let myTemp = ''
  let myMax = parseInt(document.getElementById('myNum01').value)

  for (let myLoop = 0; myLoop <= myMax; myLoop++ ){
      if (myLoop * 2 > myMax){
    myTemp += ' cool '
  }
  myTemp += 'Loop number: ' + myLoop + '<br>'
  }
  document.getElementById('myDiv01').innerHTML = myTemp
  }">

  <input type=button value="Even number identifier" onclick="{
    document.getElementById('myDiv01').innerHTML = ''
    let myTemp = ''

    let myMax = parseInt(document.getElementById('myNum01').value)

    for (let myLoop = 0; myLoop <= myMax; myLoop++ ){
      if (myLoop % 2 == 0){
        myTemp += 'Even Number, '
      }
    myTemp+= 'Loop number: ' + myLoop + '<br>'
    }
    document.getElementById('myDiv01').innerHTML = myTemp
  }">

  <div id="myDiv01"><font color = red>...</font></div>

<hr>
New stuff:<br>
Maximum: <input id='myMax02' type=number value=10><br>
Another weird number: <input id='myWeird02' type=number value=2><br>
<input type=button value="Change step amount" onclick="{
  document.getElementById('myDiv02').innerHTML = ''
  let myMaxValue = parseInt(document.getElementById('myMax02').value)
  let myStepValue = parseInt(document.getElementById('myWeird02').value)
  let myTemp02 = '';

  for (let myLoop02 = 0; myLoop02 <= myMaxValue; myLoop02 += myStepValue){
    myTemp02 += 'Loop number: ' + myLoop02 + '<br>';
  }

  document.getElementById('myDiv02').innerHTML = myTemp02;
}">
<input type=button value="Basic While Loop" onclick="{
  let myMaxValue = parseInt(document.getElementById('myMax02').value)
  let myWeirdValue = parseInt(document.getElementById('myWeird02').value)
  let myTemp02 = '';
  let myLoop02 = 0

  while (myLoop02 <= myMaxValue){
    if (myLoop02 >= myWeirdValue){
      myTemp02 += ' special '
    }
    myTemp02 += 'Loop number: ' + myLoop02 + '<br>';
    myLoop02 += 1;
  }
  document.getElementById('myDiv02').innerHTML = myTemp02;
}">
<div id="myDiv02">...</div>
