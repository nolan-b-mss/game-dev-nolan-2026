<script>
  function myExampleFunction(){
    let myIn01 = parseInt(document.getElementById('myText01').value)
    let mySum = myIn01 + myIn01
    let myReply = `${myIn01} + ${myIn01} = ${mySum}`
    return myReply
  }
  function myReverseString(){
    let myStringIn01 = document.getElementById('myString01').value
    let mySplitString = myString01.split('')
    mySplitString.reverse()
    let myStringOut01 = mySplitString.join('')
    document.getElementById('myDiv02').innerHTML = `${myStringOut01}`
  }
</script>

<h2 align=center>t1a09-functions-nolan.html</h2>

<a href="https://www.w3schools.com/js/js_functions.asp">Good reference to Javascript functions</a><br>

Functions are used to sensibly organize code. Then they are "Called" elsewhere.
Information can also be passed to functions (that's more advanced).
