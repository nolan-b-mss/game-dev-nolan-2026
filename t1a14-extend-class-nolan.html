<script>
  class myAnimal {
    constructor(passName, passAge) {
      this.myName = passName;
      this.myAge = passAge;
    }
    myShow(){
      document.getElementById('myDiv01').innerHTML = `Hello ${this.myName}<br>`
    }
  } // end class myAnimal

  class myEquation {
    constructor(passInput01, passInput02, passOperator) {
      this.myInput01 = passInput01;
      this.myInput02 = passInput02;
      this.myOperator = passOperator;
    }
    myCalculate(){
           if (this.myOperator === "+") {this.myAnswer = this.myInput01 + this.myInput02;}
      else if (this.myOperator === "-") {this.myAnswer = this.myInput01 - this.myInput02;}
      else if (this.myOperator === "*") {this.myAnswer = this.myInput01 * this.myInput02;}
      else if (this.myOperator === "/") {this.myAnswer = this.myInput01 / this.myInput02;}
      document.getElementById('myDiv02').innerHTML = `${this.myInput01} ${this.myOperator} ${this.myInput02} = ${this.myAnswer}.`
    }
  }// end class myEquation
</script>

<h2 align=center>t1a14-extend-class-nolan.html</h2>
Extending a pre-existing Class<br>

<h4>Example working classes code</h4>

<input type=button value="Example Class Set and Show Class Animal" onClick="{
  let myDog = new myAnimal('Snickers', 5)
  myDog.myShow()
}">

<h4>Example extending Class code</h4>
<input type=button value="Example Extend Class Animal" onClick="{
  class myCat extends myAnimal {
    myShow(){
      document.getElementById('myDiv01').innerHTML = `${this.myName} is a great cat`
    }
  } // end extended class myCat

  let myPet = new myCat('Fluffy', 14)
  myPet.myShow()
}">
<div id="myDiv01">...</div>
<hr>
New stuff below this:
<input type=number value=7 id="myIn01">
<input type=number value=4 id="myIn02">
<select id="myOperatorIn">
  <option value="+">+</option>
  <option value="-">-</option>
  <option value="*">*</option>
  <option value="/">/</option>
</select>
<div id="myDiv02">...</div>
<input type=button value="Calculate" onClick="{
  let passInput01 = parseFloat(document.getElementById('myIn01').value)
  let passInput02 = parseFloat(document.getElementById('myIn02').value)
  let passOperator = document.getElementById('myOperatorIn').value
  let myEnter = new myEquation (passInput01, passInput02, passOperator)
  myEnter.myCalculate();
}">
