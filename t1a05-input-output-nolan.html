<h4> Example working code</h4>

<input id="myNum01" type=number value="4" ><br>

<input type=button value="myEvent squares" onclick="{
  let myIn01 = parseFloat(document.getElementById('myNum01').value)
  let myAnswer = myIn01 * myIn01
  console.log(myAnswer)
  document.getElementById('myDiv01').innerHTML = `${myIn01} squared = ${myAnswer}`
  }"><br>

<div id="myDiv01">...</div>
<br><br>
<input type="range" id="myRange01" min="0" max="100" value="50" oninput="myRangeValue()">
<span id="mySpan06">50</span>
<b id="num50">This is 50!</b>
<script>
  function myRangeValue(){
    let myRange02 = document.getElementById('myRange01').value
    document.getElementById('mySpan06').innerHTML = myRange02
    
    if (myRange02 == 50) {document.getElementById('num50').innerHTML = "This is 50!"}
    else {document.getElementById('num50').innerHTML = "This is not 50."}
                         
  }
</script>
<br>
<input type=text value="Fred" id="myName01"><br>
<input type=text value="Williams" id="myName02"><br>

  let myFName01 = document.getElementById('myName01').value;

}">
