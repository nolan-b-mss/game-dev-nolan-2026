<script>
    let myMax = 3
    let myCards = new Array(myMax)
</script>
<input type="number" id="myMaxInput" value=3 onchange="{
    myMax = document.getElementById('myMaxInput').value
}"> Max amount of entries
<br>
<input type="button" value="Set Random" onclick="{
    for (let myLoop = 0; myLoop < myMax; myLoop++){
        myCards[myLoop] = Math.floor(Math.random()*10)
    }
    let myTemp = ''
    for (let myLoop = 0; myLoop < myMax; myLoop++){
        myTemp += myLoop + ' = ' + myCards[myLoop] + '<br>' 
    }
    document.getElementById('myDiv02').innerHTML = myTemp // shows unsorted
}">
<input type="button" value="Sort" onclick="{
    let myTemp = 0
    for (let i = 0; i < myMax; i++) {
        for (let j = 0; j < myMax - 1; j++) {
            if (myCards[j] > myCards[j + 1]) {
                myTemp = myCards[j]
                myCards[j] = myCards[j + 1]
                myCards[j + 1] = myTemp
            }
        }
    }
    let myOut01 = ''
    for (let myLoop = 0; myLoop < myMax; myLoop++){
        myOut01 += myLoop + ' = ' + myCards[myLoop] + '<br>' 
    }
    document.getElementById('myDiv01').innerHTML = myOut01 // shows sorted
}">
<br>

<input type="button" value="Selection Sort" onclick="{
    for (let myLoop = 0; myLoop < myMax; myLoop++){
        myCards[myLoop] = Math.floor(Math.random()*10)
    }
    let myRandOut = ''
    for (let myLoop = 0; myLoop < myMax; myLoop++){
        myRandOut += myLoop + ' = ' + myCards[myLoop] + '<br>' 
    }
    document.getElementById('myDiv02').innerHTML = myRandOut // shows unsorted

    let myTemp = 0
    for (let i = 0; i < myMax - 1; i++) {
        let minIdx = i
        for (let j = i + 1; j < myMax; j++) {
            if (myCards[j] < myCards[minIdx]) {
                minIdx = j
            }
        }
        if (minIdx !== i) {
            myTemp = myCards[i]
            myCards[i] = myCards[minIdx]
            myCards[minIdx] = myTemp
        }
    }
    let myOut = ''
    for (let myLoop = 0; myLoop < myMax; myLoop++){
        myOut += myLoop + ' = ' + myCards[myLoop] + '<br>' 
    }
    document.getElementById('myDiv01').innerHTML = myOut // shows sorted
}">

<input type="button" value="Insertion Sort" onclick="{
    for (let myLoop = 0; myLoop < myMax; myLoop++){
        myCards[myLoop] = Math.floor(Math.random()*10)
    }
    let myRandOut = ''
    for (let myLoop = 0; myLoop < myMax; myLoop++){
        myRandOut += myLoop + ' = ' + myCards[myLoop] + '<br>' 
    }
    document.getElementById('myDiv02').innerHTML = myRandOut // shows unsorted

    for (let i = 1; i < myMax; i++) {
        let key = myCards[i]
        let j = i - 1
        while (j >= 0 && myCards[j] > key) {
            myCards[j + 1] = myCards[j]
            j = j - 1
        }
        myCards[j + 1] = key
    }
    let myOut = ''
    for (let myLoop = 0; myLoop < myMax; myLoop++){
        myOut += myLoop + ' = ' + myCards[myLoop] + '<br>' 
    }
    document.getElementById('myDiv01').innerHTML = myOut // shows sorted
}">
