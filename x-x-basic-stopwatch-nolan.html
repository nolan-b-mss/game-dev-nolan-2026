<h1 align=center.>x-x-basic-stopwatch-nolan.html</h1>
<div id="myTimeOutput" style="font-size:24px;">00:00:00</div>
<input type="button" value="Add 30 Seconds" onclick="myAddSeconds()">
<input type="button" value="Add 30 Minutes" onclick="myAddMinutes()">
<input type="button" value="Add 1 Hour" onclick="myAddHour()"><br>
<input type="number" id ="myCustomValue" placeholder="Custom add">
<select id="mySelect01">
  <option value="customSeconds">Seconds</option>
  <option value="customMinutes">Minutes</option>
  <option value="customHours">Hours</option>
</select>
<input type="button" value="Add custom amount" onclick="myAddCustom()">
<script>
  let mySeconds = 0;
  let myMinutes = 0;
  let myHours = 0;
  function myTimeLoop(){
    mySeconds += 1
    if (mySeconds > 59){myMinutes += 1; mySeconds = 0;}
    if (myMinutes > 59){myHours += 1; myMinutes = 0; mySeconds = 0;}
    if (myHours > 23){myHours = 0; myMinutes = 0; mySeconds = 0;}
    myTimeUpdate();
  }
  function myAddSeconds(){
    mySeconds += 30;
    console.log('Added 30 seconds')
    myTimeUpdate();
  }
  function myAddMinutes(){
    myMinutes += 30;
    console.log('Added 30 minutes')
    myTimeUpdate();
  }
  function myAddHour(){
    myHours += 1;
    console.log('Added one hour')
    myTimeUpdate();
  }
  function myAddCustom(){
    let myCustomTimeValue = parseFloat(document.getElementById('myCustomValue').value)
    let myCustomSelect = document.getElementById('mySelect01').value
    if (isNaN(myCustomTimeValue)){console.log(`Couldn't add time, myCustomTimeValue returned as ${myCustomTimeValue}`);return;}
    if (myCustomSelect === "customSeconds"){
      mySeconds += myCustomTimeValue;
    }
    if (myCustomSelect === "customMinutes"){
      myMinutes += myCustomTimeValue;
    }
    if (myCustomSelect === "customHours"){
      myHours += myCustomTimeValue;
    }
    console.log(`Added ${myCustomTimeValue} ${document.getElementById('mySelect01').value}`)
    myTimeUpdate();
  }
  function myTimeUpdate(){
    if (mySeconds < 0){mySeconds = 0}
    if (myMinutes < 0){myMinutes = 0}
    if (myHours < 0){myHours = 0}
    if (mySeconds > 59){myMinutes += 1; mySeconds = 0;}
    if (myMinutes > 59){myHours += 1; myMinutes = 0; mySeconds = 0;}
    if (myHours > 23){myHours = 0; myMinutes = 0; mySeconds = 0;}
  
    if (myHours < 10 && myMinutes < 10 && mySeconds < 10){
    document.getElementById('myTimeOutput').innerHTML = `0${myHours}:0${myMinutes}:0${mySeconds}`
    }
    if (myHours < 10 && myMinutes < 10 && mySeconds >= 10){
    document.getElementById('myTimeOutput').innerHTML = `0${myHours}:0${myMinutes}:${mySeconds}`
    }
    if (myHours < 10 && myMinutes >= 10 && mySeconds >= 10){
    document.getElementById('myTimeOutput').innerHTML = `0${myHours}:${myMinutes}:${mySeconds}`
    }
    if (myHours >= 10 && myMinutes >= 10 && mySeconds >= 10){
    document.getElementById('myTimeOutput').innerHTML = `${myHours}:${myMinutes}:${mySeconds}`
    }
  }
  setInterval(myTimeLoop, 1000);
</script>
