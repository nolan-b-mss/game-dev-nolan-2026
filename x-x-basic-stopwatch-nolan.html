<h1 align=center.>x-x-basic-stopwatch-nolan.html</h1>
<div id="myTimeOutput">00:00:00</div>
<input type="button" value="Add 30 Seconds" onclick="myAddSeconds()">
<input type="button" value="Add 30 Minutes" onclick="myAddMinutes()">
<input type="button" value="Add 1 Hour" onclick="myAddHour()">
<script>
  let mySeconds = 0;
  let myMinutes = 0;
  let myHours = 0;
  function myTimeLoop(){
    mySeconds += 1
    if (mySeconds > 59){myMinutes += 1; mySeconds = 0;}
    if (myMinutes > 59){myHours += 1; myMinutes = 0; mySeconds = 0;}
    if (myHours > 23){myHours = 0; myMinutes = 0; mySeconds = 0;}
    myTimeUpdate();
  }
  function myAddSeconds(){
    mySeconds += 30;
    if (mySeconds > 59){myMinutes += 1; mySeconds = 0;}
    if (myMinutes > 59){myHours += 1; myMinutes = 0; mySeconds = 0;}
    if (myHours > 23){myHours = 0; myMinutes = 0; mySeconds = 0;}
    myTimeUpdate();
  }
  function myAddMinutes(){
    myMinutes += 30;
    if (mySeconds > 59){myMinutes += 1; mySeconds = 0;}
    if (myMinutes > 59){myHours += 1; myMinutes = 0; mySeconds = 0;}
    if (myHours > 23){myHours = 0; myMinutes = 0; mySeconds = 0;}
    myTimeUpdate();
  }
  function myAddHour(){
    myHours += 1;
    if (mySeconds > 59){myMinutes += 1; mySeconds = 0;}
    if (myMinutes > 59){myHours += 1; myMinutes = 0; mySeconds = 0;}
    if (myHours > 23){myHours = 0; myMinutes = 0; mySeconds = 0;}
    myTimeUpdate();
  }
  function myTimeUpdate(){
    if (myHours < 10 && myMinutes < 10 && mySeconds < 10){
    document.getElementById('myTimeOutput').innerHTML = `0${myHours}:0${myMinutes}:0${mySeconds}`
    }
    if (myHours < 10 && myMinutes < 10 && mySeconds >= 10){
    document.getElementById('myTimeOutput').innerHTML = `0${myHours}:0${myMinutes}:${mySeconds}`
    }
    if (myHours < 10 && myMinutes >= 10 && mySeconds >= 10){
    document.getElementById('myTimeOutput').innerHTML = `0${myHours}:${myMinutes}:${mySeconds}`
    }
    if (myHours >= 10 && myMinutes >= 10 && mySeconds >= 10){
    document.getElementById('myTimeOutput').innerHTML = `${myHours}:${myMinutes}:${mySeconds}`
    }
  } 
  setInterval(myTimeLoop, 1000);
</script>
