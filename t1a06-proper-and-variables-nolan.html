<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>t1a06-proper-and-variables-nolan.html</title>
  <style>
    b { color: blue; }
    i { color: indigo; }
  </style>
  <script>
let myNum = 3;
let myString = ' Hello ';
let myFloat = 17.5;
let myBool = true;
    function sayHello(){
      myOut = document.getElementById('myDiv01');
      myOut.innerHTML = `${myNum} + ${myString} + ${myFloat} + ', ' + ${myBool}`;
      if (myBool) {myOut.innerHTML += ', WOW';}
    }
    function myUpdateMyNum(){
      myNum = document.getElementById('myNumIn').value;
      sayHello();
    }
    function myBoolSwap(){
      if (myBool) {myBool = false;}
      else {myBool = true;}
      sayHello();
    }
    function myStringEdit(){
      let myEditedString = document.getElementById('myStringEditor');
      myString = ` ${myEditedString} `
      sayHello();
  </script>
</head>
<body>
  <p>This is <b>bold</b> text.</p>
  <button onclick="sayHello()">Click Me</button>
  <div id="myDiv01">...</div>
<hr>
New stuff is below this
  <p>This is <i>italic</i> text.</p>
  <input type="number" id="myNumIn" value = 3 oninput="myUpdateMyNum()"> change this number to change myNum<br>
  <input type="button" value="Swap myBool true/false" onclick="myBoolSwap()"><br>
  <input type="textarea" value="Hello" oninput="myStringEdit()" id="myStringEditor"> change myString<br>
</body>
</html>
